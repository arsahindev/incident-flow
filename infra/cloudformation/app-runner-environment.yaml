# Historical AWS topology, retired for cost. Do not deploy; see docs/free-demo-deployment.md.
AWSTemplateFormatVersion: "2010-09-09"
Description: One isolated IncidentFlow App Runner and PostgreSQL environment.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, prod]
  ImageIdentifier:
    Type: String
    Description: Immutable ECR image URI including its tag.
  WebOrigin:
    Type: String
    Description: Public HTTPS origin used by the web app and Socket.IO handshake.
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SeedOwnerEmail:
    Type: String
    Description: Initial owner email for this isolated demo environment.

Resources:
  AppRunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "IncidentFlow ${EnvironmentName} App Runner egress"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "IncidentFlow ${EnvironmentName} PostgreSQL access"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppRunnerSecurityGroup

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "IncidentFlow ${EnvironmentName} database subnets"
      SubnetIds: !Ref SubnetIds

  DatabasePasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "IncidentFlow ${EnvironmentName} PostgreSQL password"
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  PasswordPepperSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "IncidentFlow ${EnvironmentName} password pepper"
      GenerateSecretString:
        PasswordLength: 44
        ExcludePunctuation: true

  DemoOwnerPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "IncidentFlow ${EnvironmentName} demonstration owner password"
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "incidentflow-${EnvironmentName}"
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      DBName: incidentflow
      MasterUsername: incidentflow
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabasePasswordSecret}:SecretString}}"
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      MultiAZ: false
      DeletionProtection: false
      CopyTagsToSnapshot: true
      EnablePerformanceInsights: false

  AppRunnerEcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadEnvironmentSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabasePasswordSecret
                  - !Ref PasswordPepperSecret
                  - !Ref DemoOwnerPasswordSecret

  VpcConnector:
    Type: AWS::AppRunner::VpcConnector
    Properties:
      VpcConnectorName: !Sub "incidentflow-${EnvironmentName}"
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AppRunnerSecurityGroup]

  SingleInstanceScaling:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Metadata:
      com.aws.cloudformation.Context:
        why: Phase 3 Socket.IO rooms and polling sessions are held in one process.
        must:
          - Keep one active instance until distributed realtime and session routing exist.
    Properties:
      AutoScalingConfigurationName: !Sub "incidentflow-${EnvironmentName}-single"
      MinSize: 1
      MaxSize: 1
      MaxConcurrency: 100

  Service:
    Type: AWS::AppRunner::Service
    Metadata:
      com.aws.cloudformation.Context:
        why: One HTTPS origin preserves the browser session cookie for web and Socket.IO polling.
        must:
          - Preserve the exact WEB_ORIGIN and single-instance scaling configuration.
          - Public demo credentials belong only to the seeded responder; owner credentials stay private.
    Properties:
      ServiceName: !Sub "incidentflow-${EnvironmentName}"
      AutoScalingConfigurationArn: !GetAtt SingleInstanceScaling.AutoScalingConfigurationArn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /ready
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      InstanceConfiguration:
        Cpu: 1 vCPU
        Memory: 2 GB
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn
      NetworkConfiguration:
        EgressConfiguration:
          EgressType: VPC
          VpcConnectorArn: !GetAtt VpcConnector.VpcConnectorArn
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerEcrAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - Name: PUBLIC_DEMO_ENVIRONMENT
                Value: !Ref EnvironmentName
              - Name: API_URL
                Value: http://127.0.0.1:4000
              - Name: NEXT_PUBLIC_REALTIME_URL
                Value: same-origin
              - Name: WEB_ORIGIN
                Value: !Ref WebOrigin
              - Name: DB_HOST
                Value: !GetAtt Database.Endpoint.Address
              - Name: DB_PORT
                Value: !GetAtt Database.Endpoint.Port
              - Name: DB_NAME
                Value: incidentflow
              - Name: DB_USER
                Value: incidentflow
              - Name: SEED_DEMO_DATA
                Value: "true"
              - Name: SEED_OWNER_EMAIL
                Value: !Ref SeedOwnerEmail
              - Name: SEED_ORGANIZATION_NAME
                Value: !Sub "IncidentFlow ${EnvironmentName}"
              - Name: SEED_ORGANIZATION_SLUG
                Value: !Sub "incidentflow-${EnvironmentName}"
            RuntimeEnvironmentSecrets:
              - Name: DB_PASSWORD
                Value: !Ref DatabasePasswordSecret
              - Name: PASSWORD_PEPPER
                Value: !Ref PasswordPepperSecret
              - Name: SEED_OWNER_PASSWORD
                Value: !Ref DemoOwnerPasswordSecret

Outputs:
  ServiceUrl:
    Description: Public HTTPS origin for the web app, API health, and Socket.IO endpoint.
    Value: !Sub "https://${Service.ServiceUrl}"
  HealthUrl:
    Value: !Sub "https://${Service.ServiceUrl}/health"
  ReadinessUrl:
    Value: !Sub "https://${Service.ServiceUrl}/ready"
  DatabaseSecretArn:
    Value: !Ref DatabasePasswordSecret
  DemoOwnerPasswordSecretArn:
    Value: !Ref DemoOwnerPasswordSecret
