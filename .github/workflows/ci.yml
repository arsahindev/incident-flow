name: CI

on:
  pull_request:
  push:
    branches: [main, phase_1, "codex/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: incidentflow
          POSTGRES_PASSWORD: incidentflow_ci
          POSTGRES_DB: incidentflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentflow -d incidentflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://incidentflow:incidentflow_ci@localhost:5432/incidentflow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @incidentflow/api exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
